[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codesearch-local"
version = "0.2.2"
description = "Local, read-only MCP code intelligence for developer workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4.1.6,<5",
  # 0.26.0 corrupts Point.row/column references (py-tree-sitter issue #500).
  "tree-sitter==0.25.2",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-rust>=0.24,<0.25",
  "pyyaml>=6.0.3,<7",
  "rank-bm25>=0.2.2,<0.3",
  "pathspec>=0.12,<2",
  "regex>=2025.11,<2027",
  "tree-sitter-bash>=0.25,<0.26",
]

[project.scripts]
codesearch = "codesearch.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/codesearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
